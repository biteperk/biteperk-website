name: Deploy Firebase Hosting

on:
  workflow_dispatch:

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  # workflow_dispatch uses the selected ref. After integration becomes default,
  # a UI "Run workflow" click often lands on integration and used to skip the
  # deploy job silently. Fail loudly instead.
  refuse-non-main:
    name: Refuse deploy from non-main
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - name: Explain how to deploy production
        run: |
          set -euo pipefail
          echo "::error title=Wrong ref for production deploy::Deploy Firebase Hosting must be dispatched with ref main (this run is ${{ github.ref }}). Use: gh workflow run \"Deploy Firebase Hosting\" --ref main"
          exit 1

  deploy:
    name: Deploy latest main to Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'
    environment: production
    env:
      INTL_LAUNCHED: "true"
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install website dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Validate deploy environment
        run: |
          set -euo pipefail

          require_env() {
            local name="$1"
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing GitHub variable::Set ${name} on the production GitHub Environment or repository variables." >&2
              exit 1
            fi
          }

          require_env "FIREBASE_PROJECT_ID"
          require_env "GCP_WORKLOAD_IDENTITY_PROVIDER"
          require_env "GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - name: Build merged production site
        run: npm run build:site

      # The published forms depend on these endpoints. Deploy the backend
      # first so Hosting can never ship a newer form contract while an older
      # function is still serving /api/contact or /api/event.
      - name: Deploy Firebase Functions
        run: |
          node --check functions/index.js
          npx --yes firebase-tools@13.35.1 deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only functions \
            --non-interactive

      - name: Deploy Firebase Hosting
        run: |
          npx --yes firebase-tools@13.35.1 deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only hosting:biteperk-global,hosting:biteperk \
            --non-interactive
