name: web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-flight runs on the same ref when a new push lands.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Type-check, build, link-check
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Smoke-test built routes (generated from cities.ts + blog)
        run: node scripts/check-routes.mjs

      - name: WCAG contrast gate (both themes)
        run: node scripts/check-contrast.mjs

      - name: City-page anti-doorway gate
        run: node scripts/check-cities.mjs

      - name: JSON-LD @id + NAP integrity
        run: node scripts/check-schema.mjs

      - name: Sanity-check sitemap
        run: |
          set -e
          test -f dist/sitemap-0.xml || { echo "Missing dist/sitemap-0.xml"; exit 1; }
          grep -q 'biteperk.com.au' dist/sitemap-0.xml
          grep -q 'products/vocotable' dist/sitemap-0.xml
          echo "Sitemap looks healthy."

      - name: Internal link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-mail
            --exclude '^https://(vocotable\.biteperk|formspree)'
            --base ./dist
            ./dist/**/*.html
          fail: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
