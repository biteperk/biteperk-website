name: web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-flight runs on the same ref when a new push lands.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build & gate (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [au, global]
    env:
      BUILD_TARGET: ${{ matrix.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run check

      # BUILD_TARGET (job env) drives astro.config: au → dist/, global → dist-global/.
      - name: Build
        run: npm run build

      # Global pass: prune the AU pages that build alongside, write global llms.txt.
      - name: Finalize global build
        if: matrix.target == 'global'
        run: |
          node scripts/build/prune-global.mjs
          node scripts/build/llms-global.mjs

      - name: Resolve dist dir
        run: echo "DIST=$([ "$BUILD_TARGET" = "global" ] && echo dist-global || echo dist)" >> "$GITHUB_ENV"

      - name: Imagery review gate (manifest slots must be human-reviewed)
        run: node scripts/gates/check-images.mjs

      - name: Smoke-test built routes (generated per target)
        run: node scripts/gates/check-routes.mjs

      - name: Asset references in built HTML must resolve
        run: node scripts/gates/check-assets.mjs

      - name: JSON-LD @id + NAP / cross-domain entity integrity
        run: node scripts/gates/check-schema.mjs

      - name: WCAG contrast gate (shared themes — run on the AU pass)
        if: matrix.target == 'au'
        run: node scripts/gates/check-contrast.mjs

      - name: City-page anti-doorway gate (AU only)
        if: matrix.target == 'au'
        run: node scripts/gates/check-cities.mjs

      - name: hreflang integrity (global only)
        if: matrix.target == 'global'
        run: node scripts/gates/check-hreflang.mjs

      - name: Sanity-check sitemap
        run: |
          set -e
          test -f "$DIST/sitemap-0.xml" || { echo "Missing $DIST/sitemap-0.xml"; exit 1; }
          if [ "$BUILD_TARGET" = "global" ]; then
            grep -qF 'biteperk.com/en/' "$DIST/sitemap-0.xml"
          else
            # -F (literal): the old pattern 'biteperk.com.au' had unescaped
            # dots, so it matched 'biteperk.com/au-en' and kept passing after
            # the single-domain move — a no-op assertion. The AU sitemap must
            # now point at the /au-en base on the canonical host, and must NOT
            # still be emitting the retired ccTLD.
            grep -qF 'https://biteperk.com/au-en/' "$DIST/sitemap-0.xml"
            grep -qF 'products/voxtable' "$DIST/sitemap-0.xml"
            ! grep -qF 'https://biteperk.com.au' "$DIST/sitemap-0.xml"
          fi
          echo "Sitemap looks healthy."

      - name: Internal link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-mail
            --exclude '^https://(vocotable\.biteperk|formspree)'
            --base ./${{ env.DIST }}
            ./${{ env.DIST }}/**/*.html
          fail: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---- Behavioural QA runs on the AU pass. The /en/ + /fr/ pages are
      # noindex Phase-1 placeholders; their Playwright specs and Lighthouse
      # budgets land with the Phase-2 Europe-truthful content. ----

      - name: Install Playwright browsers
        if: matrix.target == 'au'
        run: npx playwright install --with-deps chromium webkit

      - name: Playwright E2E + axe (theme, menus, contact, routes, a11y)
        if: matrix.target == 'au'
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure() && matrix.target == 'au'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      # Lighthouse measures the MERGED tree (dist-site/), because that is what
      # biteperk.com serves. dist/ alone can't be measured: its pages sit flat
      # but reference /au-en/** assets, which 404 when served at the root.
      - name: Build merged site for Lighthouse
        if: matrix.target == 'au'
        run: npm run build:site

      - name: Lighthouse CI budgets (perf ≥95, LCP ≤2.5s, CLS ≤0.02, JS ≤60KB)
        if: matrix.target == 'au'
        run: npm run lhci

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: ${{ env.DIST }}
          retention-days: 7
